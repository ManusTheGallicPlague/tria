<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="91mm" height="61mm" viewBox="0 0 910 610" role="img" aria-labelledby="title desc">
  <title id="title">TRIA — biglietto da visita, retro</title>
  <desc id="desc">Retro nero con claim di TRIA in arancio, servizi, nomi del team e contatti.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&amp;family=Manrope:ital,wght@0,400;0,500;0,600;0,700;1,500&amp;display=swap');
      .sans { font-family: 'Manrope', Arial, sans-serif; }
      .mono { font-family: 'DM Mono', 'Courier New', monospace; }
    </style>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="monoNoise"/>
      <feComponentTransfer in="monoNoise">
        <feFuncA type="table" tableValues="0 0.09"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- 91 × 61 mm includes 3 mm bleed around an 85 × 55 mm trim. -->
  <rect width="910" height="610" fill="#171716"/>

  <g transform="translate(72 57) scale(1.36)" fill="#f1eee6">
    <path d="M21 2 40 36H2L21 2Z"/>
    <circle cx="21" cy="25" r="6.5" fill="#171716"/>
  </g>
  <text class="sans" x="143" y="108" fill="#f1eee6" font-size="54" font-weight="700" letter-spacing="-4.2">TRIA</text>
  <text class="mono" x="260" y="73" fill="#f1eee6" font-size="12">®</text>

  <g class="mono" fill="#f1eee6" font-size="14" letter-spacing="1">
    <text x="680" y="75">MANU / LEO / FRA</text>
    <text x="680" y="99" fill="#d7ef3f">●  ONLINE</text>
  </g>

  <line x1="70" y1="139" x2="840" y2="139" stroke="#f1eee6" stroke-opacity=".42" stroke-width="1.5"/>

  <text class="sans" x="66" y="246" fill="#f1eee6" font-size="83" font-weight="500" letter-spacing="-5.5">Costruiamo</text>
  <text class="sans" x="66" y="335" fill="#f1eee6" font-size="83" font-weight="500" letter-spacing="-5.5">digitale</text>
  <text class="sans" x="66" y="424" fill="#ff4b24" font-size="83" font-weight="500" font-style="italic" letter-spacing="-5.5">che conta.</text>

  <g class="mono" font-size="13" letter-spacing=".55">
    <text x="568" y="248" fill="#f1eee6">STRATEGY</text>
    <text x="568" y="277" fill="#f1eee6">UX/UI</text>
    <text x="568" y="306" fill="#f1eee6">WEB APPS</text>
    <text x="568" y="335" fill="#f1eee6">MOBILE</text>
    <text x="568" y="364" fill="#f1eee6">AI &amp; AUTOMATION</text>
  </g>
  <rect x="540" y="236" width="8" height="139" fill="#2449d8"/>

  <line x1="70" y1="470" x2="840" y2="470" stroke="#f1eee6" stroke-opacity=".42" stroke-width="1.5"/>
  <g class="mono" fill="#f1eee6" font-size="15" letter-spacing=".45">
    <text x="70" y="511">CIAO@TRIA.STUDIO ↗</text>
    <text x="70" y="548">TRIA.PLAYGROUNDAI.SPACE</text>
    <text x="782" y="548">02 / 02</text>
  </g>

  <rect x="820" y="491" width="20" height="20" fill="#ff4b24"/>
  <rect width="910" height="610" filter="url(#grain)" opacity=".55" pointer-events="none"/>
</svg>
